  <script>
    const STORAGE_KEY = 'gustopro_fb_banqueting_v1';

      { id: 'sesamo', label: 'Sesamo', short: 'SES' }, { id: 'solfiti', label: 'Solfiti', short: 'SOL' },
      { id: 'lupini', label: 'Lupini', short: 'LUP' }, { id: 'molluschi', label: 'Molluschi', short: 'MOL' }
    ];
    const ING_CATS = ['Carne', 'Pesce', 'Ortofrutta', 'Latticini', 'Dry', 'Vini/Beverage', 'Consumabili'];
    const EQ_CATS = ['Tavoli', 'Sedie', 'Tovagliato', 'Posateria', 'Cristalleria', 'Porcellane', 'Attrezzatura cucina mobile', 'Allestimenti'];

    let state = { ingredients: [], equipment: [], recipes: [], packages: [], events: [], suppliers: [], staff: [], shifts: [], movements: [], restaurantSales: [] };
    let ui = {
      activeTab: 'dashboard', dashboardFilter: 'all', ingSearch: '', ingCategory: 'Tutte',
      eqSearch: '', eqCategory: 'Tutte', eqCheckDate: '', recipeSubTab: 'recipes', recipeSearch: '',
      eventFilterStatus: 'Tutti', activeEventId: null, activeEventSubTab: 'overview',
      inventorySubTab: 'carico', staffSubTab: 'staff', shiftWeekStart: ''
    };
    let chartInstances = {};
    let draggedTableInfo = null;

    // Helpers
    const todayStr = (off = 0) => { const d = new Date(); d.setDate(d.getDate() + off); return d.toISOString().split('T')[0]; };
    const getMonday = (s) => { const d = s ? new Date(s + 'T12:00:00') : new Date(); const day = d.getDay(); d.setDate(d.getDate() - day + (day === 0 ? -6 : 1)); return d.toISOString().split('T')[0]; };
    const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().split('T')[0]; };
    const fmtDate = (s) => { if (!s) return '-'; const p = s.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s; };
    const round2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
    const fmtEuro = (n) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(Number(n) || 0);
    const fmtNum = (n, d = 2) => new Intl.NumberFormat('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d }).format(Number(n) || 0);
    const uid = (p = 'id') => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
    const esc = (s) => s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    function showToast(msg, type = 'success') {
      const c = document.getElementById('toast-container');
      const cls = { success: 'bg-emerald-900 border-emerald-700', warning: 'bg-amber-900 border-amber-700', error: 'bg-rose-900 border-rose-700', info: 'bg-slate-900 border-slate-700' };
      const t = document.createElement('div');
      t.className = `flex items-center gap-2 px-4 py-3 rounded-xl shadow-xl border text-white text-xs font-medium transition ${cls[type] || cls.info}`;
      t.innerHTML = `<i data-lucide="info" class="w-4 h-4 shrink-0"></i><span>${esc(msg)}</span>`;
      c.appendChild(t); lucide.createIcons({ nodes: [t] });
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
    }

    function openModal(html) {
      const box = document.getElementById('modal-box');
      box.innerHTML = html;
      document.getElementById('modal-container').classList.remove('hidden');
      lucide.createIcons({ nodes: [box] });
    }
    function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }

    // =========================================================================
    // MATH ENGINE F&B
    // =========================================================================
    function getIngUsablePurchaseCost(ing) {
      const w = Math.min(Math.max(Number(ing.wastePct) || 0, 0), 99);
      return round2((Number(ing.priceNet) || 0) / (1 - w / 100));
    }
    function getIngUsableUseUnitCost(ing) {
      return getIngUsablePurchaseCost(ing) / Math.max(Number(ing.conversionFactor) || 1, 0.0001);
    }

    function getRecipeAnalysis(recipeId, visited = new Set()) {
      const r = state.recipes.find(x => x.id === recipeId);
      if (!r || visited.has(recipeId)) return { totalCost: 0, costPerYieldUnit: 0, foodCostPct: 0, margin: 0, allergens: [], grossPrice: 0 };
      visited.add(recipeId);
      let totalCost = 0; const al = new Set();
      (r.items || []).forEach(it => {
        if (it.type === 'ingredient') {
          const ing = state.ingredients.find(i => i.id === it.refId);
          if (ing) { totalCost += getIngUsableUseUnitCost(ing) * (Number(it.qty) || 0); (ing.allergens || []).forEach(a => al.add(a)); }
        } else {
          const sub = getRecipeAnalysis(it.refId, new Set(visited));
          totalCost += sub.costPerYieldUnit * (Number(it.qty) || 0); sub.allergens.forEach(a => al.add(a));
        }
      });
      totalCost = round2(totalCost);
      const yq = Math.max(Number(r.yieldQty) || 1, 0.0001);
      const sell = Number(r.sellingPriceNet) || 0;
      return {
        totalCost, costPerYieldUnit: r.isSemiFinished ? (totalCost / yq) : totalCost,
        foodCostPct: sell > 0 ? round2((totalCost / sell) * 100) : 0,
        margin: round2(sell - totalCost), allergens: Array.from(al),
        grossPrice: round2(sell * (1 + (Number(r.vatPct) || 10) / 100))
      };
    }

    function explodeRecipe(recipeId, mult = 1, acc = {}, visited = new Set()) {
      const r = state.recipes.find(x => x.id === recipeId);
      if (!r || visited.has(recipeId)) return acc;
      visited.add(recipeId);
      (r.items || []).forEach(it => {
        if (it.type === 'ingredient') {
          const ing = state.ingredients.find(i => i.id === it.refId);
          if (ing) {
            const conv = Math.max(Number(ing.conversionFactor) || 1, 0.0001);
            const w = Math.min(Math.max(Number(ing.wastePct) || 0, 0), 99);
            acc[ing.id] = (acc[ing.id] || 0) + ((Number(it.qty) || 0) * mult) / (conv * (1 - w / 100));
          }
        } else {
          const sr = state.recipes.find(x => x.id === it.refId);
          if (sr) explodeRecipe(sr.id, ((Number(it.qty) || 0) * mult) / Math.max(Number(sr.yieldQty) || 1, 0.0001), acc, new Set(visited));
        }
      });
      return acc;
    }

    function getPackageAnalysis(pkgId) {
      const pkg = state.packages.find(p => p.id === pkgId);
      if (!pkg) return { adultCost: 0, childCost: 0, adultPrice: 0, childPrice: 0, adultMargin: 0, adultMarginPct: 0, foodCostPct: 0, allergens: [] };
      let adultCost = 0; const al = new Set();
      (pkg.recipeIds || []).forEach(rid => { const ra = getRecipeAnalysis(rid); adultCost += ra.totalCost; ra.allergens.forEach(a => al.add(a)); });
      adultCost = round2(adultCost);
      const childCost = round2(adultCost * ((Number(pkg.childCostPct) || 50) / 100));
      const ap = Number(pkg.adultPriceNet) || 0, cp = Number(pkg.childPriceNet) || 0, am = round2(ap - adultCost);
      return { adultCost, childCost, adultPrice: ap, childPrice: cp, adultMargin: am, adultMarginPct: ap > 0 ? round2((am / ap) * 100) : 0, foodCostPct: ap > 0 ? round2((adultCost / ap) * 100) : 0, allergens: Array.from(al) };
    }

    function getEquipmentAvailability(eqId, dateStr, excludeEvId = null) {
      const eq = state.equipment.find(e => e.id === eqId);
      if (!eq) return { total: 0, committed: 0, available: 0 };
      const total = Number(eq.totalQty) || 0;
      let committed = 0;
      if (dateStr) {
        state.events.forEach(ev => {
          if (ev.id !== excludeEvId && ev.date === dateStr && ev.status === 'Confermato') {
            const f = (ev.equipmentList || []).find(i => i.equipmentId === eqId);
            if (f) committed += Number(f.qty) || 0;
          }
        });
      }
      return { total, committed, available: Math.max(0, total - committed - (eq.status === 'Manutenzione' ? total : 0)) };
    }

    function getEventFinancials(ev) {
      if (!ev) return {};
      const pkg = getPackageAnalysis(ev.packageId);
      const ad = Number(ev.adults) || 0, ch = Number(ev.children) || 0, sm = Number(ev.staffMeals) || 0;
      const menuRevenue = round2(ad * pkg.adultPrice + ch * pkg.childPrice);
      const extrasRevenue = round2((ev.extras || []).reduce((s, x) => s + (Number(x.clientPrice) || 0), 0));
      const totalRevenue = round2(menuRevenue + extrasRevenue);
      const foodCost = round2(ad * pkg.adultCost + ch * pkg.childCost + sm * round2(pkg.adultCost * 0.35));
      const extrasCost = round2((ev.extras || []).reduce((s, x) => s + (Number(x.supplierCost) || 0), 0));
      const rentalCost = round2((ev.equipmentList || []).reduce((s, it) => {
        const eq = state.equipment.find(e => e.id === it.equipmentId);
        return s + (eq && eq.type === 'A Noleggio' ? (Number(eq.rentalCost) || 0) * (Number(it.qty) || 0) : 0);
      }, 0));
      const staffCost = round2((ev.staffAssigned || []).reduce((s, sa) => {
        const p = state.staff.find(x => x.id === sa.staffId);
        return s + (p ? (Number(p.hourlyCost) || 0) * (Number(sa.hours) || 0) : 0);
      }, 0));
      const totalCosts = round2(foodCost + staffCost + rentalCost + extrasCost);
      const netProfit = round2(totalRevenue - totalCosts);
      const paidAmount = round2((ev.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0));
      return {
        menuRevenue, extrasRevenue, totalRevenue, foodCost, staffCost, rentalCost, extrasCost, totalCosts, netProfit,
        netMarginPct: totalRevenue > 0 ? round2((netProfit / totalRevenue) * 100) : 0,
        foodCostPct: totalRevenue > 0 ? round2((foodCost / totalRevenue) * 100) : 0,
        labourCostPct: totalRevenue > 0 ? round2((staffCost / totalRevenue) * 100) : 0,
        paidAmount, balanceDue: round2(totalRevenue - paidAmount)
      };
    }

    function getDashboardMetrics(mode = 'all') {
      const mPref = todayStr().slice(0, 7);
      const evs = state.events.filter(e => (e.status === 'Confermato' || e.status === 'Concluso') && (mode === 'month' ? (e.date || '').startsWith(mPref) : true));
      let bRev = 0, bFC = 0, bLC = 0, bEx = 0;
      evs.forEach(e => { const f = getEventFinancials(e); bRev += f.totalRevenue; bFC += f.foodCost; bLC += f.staffCost; bEx += f.rentalCost + f.extrasCost; });

      let rRev = 0, rFC = 0;
      state.restaurantSales.filter(s => mode === 'month' ? (s.date || '').startsWith(mPref) : true).forEach(s => {
        const r = state.recipes.find(x => x.id === s.recipeId);
        if (r) { rRev += (Number(s.qty) || 0) * (Number(r.sellingPriceNet) || 0); rFC += (Number(s.qty) || 0) * getRecipeAnalysis(r.id).totalCost; }
      });

      let rLC = 0;
      state.shifts.filter(sh => mode === 'month' ? (sh.date || '').startsWith(mPref) : true).forEach(sh => {
        const st = state.staff.find(p => p.id === sh.staffId);
        if (st) rLC += (Number(sh.hours) || 0) * (Number(st.hourlyCost) || 0);
      });

      const waste = state.movements.filter(m => m.type === 'SCARTO' && (mode === 'month' ? (m.date || '').startsWith(mPref) : true)).reduce((s, m) => s + (Number(m.totalValue) || 0), 0);
      const totalRevenue = round2(bRev + rRev);
      const totalFoodCost = round2(bFC + rFC + waste);
      const totalLabourCost = round2(bLC + rLC);
      const totalExtraRental = round2(bEx);
      const netOperatingMargin = round2(totalRevenue - totalFoodCost - totalLabourCost - totalExtraRental);
      const foodCostPct = totalRevenue > 0 ? round2((totalFoodCost / totalRevenue) * 100) : 0;
      const labourCostPct = totalRevenue > 0 ? round2((totalLabourCost / totalRevenue) * 100) : 0;
      return {
        totalRevenue, banqRevenue: round2(bRev), restRevenue: round2(rRev),
        banqCosts: round2(bFC + bLC + bEx), restCosts: round2(rFC + rLC + waste),
        totalFoodCost, totalLabourCost, totalExtraRental, netOperatingMargin,
        foodCostPct, labourCostPct, primeCostPct: round2(foodCostPct + labourCostPct), activeEventsCount: evs.length
      };
    }

    // =========================================================================
    // PERSISTENCE, DEMO & BACKUP
    // =========================================================================
    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); updateSidebarAlerts(); }

    function loadState() {
      try {
        const p = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (p && Array.isArray(p.ingredients)) { state = { ...state, ...p }; return; }
      } catch (e) {}
      loadDemoData(false);
    }

      state = {

          { id: 'sup_2', name: 'Ittica Tirreno Spa', category: 'Food', phone: '+39 0586 410220', email: 'ordini@itticatirreno.it', deliveryDays: 'Mar, Ven', paymentTerms: 'Rimessa Diretta' },
          { id: 'sup_3', name: 'Ortofrutta & Primizie Bio', category: 'Food', phone: '+39 055 712934', email: 'ordini@primiziebio.it', deliveryDays: 'Lun-Sab', paymentTerms: '15 gg FM' },

    function importJSONBackup(ev) {
      const f = ev.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = e => {
        try {
          const p = JSON.parse(e.target.result);
          if (!p || !Array.isArray(p.ingredients)) throw new Error('JSON non valido');
          state = { ingredients: p.ingredients || [], equipment: p.equipment || [], recipes: p.recipes || [], packages: p.packages || [], events: p.events || [], suppliers: p.suppliers || [], staff: p.staff || [], shifts: p.shifts || [], movements: p.movements || [], restaurantSales: p.restaurantSales || [] };
          saveState(); renderApp(); showToast('Backup JSON importato!', 'success');
        } catch (err) { showToast('Errore: ' + err.message, 'error'); }
        ev.target.value = '';
      };
      r.readAsText(f);
    }

    function downloadCSV(name, headers, rows) {
      const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const csv = '\uFEFF' + [headers.map(q).join(';'), ...rows.map(r => r.map(q).join(';'))].join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      a.download = name; a.click();
      showToast(`Esportato ${name}`, 'success');
    }

          <div><label class="block font-semibold mb-1">Prezzo Netto</label><input id="ip" name="priceNet" type="number" step="0.01" required value="${i.priceNet}" oninput="prevIng()" class="w-full px-3 py-2 rounded-xl border bg-white" /></div>
          <div><label class="block font-semibold mb-1">% Scarto</label><input id="iw" name="wastePct" type="number" step="0.5" max="95" required value="${i.wastePct}" oninput="prevIng()" class="w-full px-3 py-2 rounded-xl border bg-white" /></div>
          <div><label class="block font-semibold mb-1">Giacenza</label><input name="stock" type="number" step="0.01" required value="${i.stock}" class="w-full px-3 py-2 rounded-xl border bg-white" /></div>
          <div><label class="block font-semibold mb-1">Scorta Min</label><input name="minStock" type="number" step="0.01" required value="${i.minStock}" class="w-full px-3 py-2 rounded-xl border bg-white" /></div>

        </div>
        <div><label class="block font-semibold mb-1">14 Allergeni</label><div class="grid grid-cols-2 sm:grid-cols-5 gap-1.5">${ALLERGENS.map(a => `<label class="flex items-center gap-1.5 p-1.5 border rounded-lg"><input type="checkbox" name="allergens" value="${a.id}" ${(i.allergens||[]).includes(a.id)?'checked':''} /><span>${a.label}</span></label>`).join('')}</div></div>

    function prevIng() { const p = Number(document.getElementById('ip')?.value)||0, w = Math.min(Math.max(Number(document.getElementById('iw')?.value)||0,0),99); document.getElementById('iprev').textContent = fmtEuro(round2(p/(1-w/100))); }
    function saveIngredient(e, id) {

    function openEquipmentModal(id = null) {
      const e = id ? state.equipment.find(x => x.id === id) : { id: '', code: `ATT-${String(state.equipment.length + 1).padStart(3, '0')}`, name: '', category: 'Tavoli', type: 'Di Proprietà', supplierId: '', rentalCost: 0, totalQty: 10, replacementCost: 0, status: 'Disponibile' };
      openModal(`<div class="px-6 py-4 border-b flex justify-between bg-slate-50"><h3 class="font-bold">${id ? 'Modifica' : 'Nuova'} Attrezzatura</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>

    function saveEquipment(ev, id) {

        </div>`;

          <div class="space-y-2"><div>Target FC%: <input id="sfc" type="number" value="25" min="5" max="80" oninput="recalcR()" class="w-14 px-2 py-0.5 border rounded bg-white font-bold" /> &rarr; Prezzo Sugg.: <strong id="ssug">€ 0,00</strong></div><div>Prezzo Vendita Netto: <input id="rsell" name="sellingPriceNet" type="number" step="0.1" value="${r.sellingPriceNet}" oninput="recalcR()" class="w-20 px-2 py-1 border rounded bg-white font-bold" /></div></div>
          <div class="grid grid-cols-3 text-center items-center bg-white rounded-xl p-2"><div><div class="text-[10px] text-slate-400">Costo</div><div id="lc" class="font-bold">€0</div></div><div><div class="text-[10px] text-slate-400">FC%</div><div id="lf" class="font-bold text-amber-600">0%</div></div><div><div class="text-[10px] text-slate-400">Margine</div><div id="lm" class="font-bold text-emerald-600">€0</div></div></div>

    function addRItem() { const [type, refId] = document.getElementById('rsel').value.split(':'); const qty = Number(document.getElementById('rqty').value)||0; if (refId && qty>0) { tmpRecItems.push({type,refId,qty}); renderRList(); } }
    function renderRList() {
      const w = document.getElementById('rlist'); if (!w) return;
      w.innerHTML = tmpRecItems.map((it,idx) => {
        const n = it.type==='ingredient' ? state.ingredients.find(i=>i.id===it.refId)?.name : '[SL] '+state.recipes.find(r=>r.id===it.refId)?.name;
        const c = it.type==='ingredient' ? (getIngUsableUseUnitCost(state.ingredients.find(i=>i.id===it.refId)||{})*it.qty) : (getRecipeAnalysis(it.refId).costPerYieldUnit*it.qty);
        return `<div class="flex items-center justify-between py-1.5 gap-2"><span class="flex-1">${esc(n)}</span><input type="number" step="0.1" value="${it.qty}" onchange="tmpRecItems[${idx}].qty=Number(this.value)||0; renderRList()" class="w-20 px-2 py-0.5 border rounded text-right" /><span class="w-16 text-right font-bold">${fmtEuro(c)}</span><button type="button" onclick="tmpRecItems.splice(${idx},1); renderRList()" class="text-rose-500">✕</button></div>`;
      }).join('') || '<div class="py-3 text-center text-slate-400">Vuoto</div>';
      recalcR();
    }
    function recalcR() {
      let c = 0; tmpRecItems.forEach(it => { c += it.type==='ingredient' ? getIngUsableUseUnitCost(state.ingredients.find(i=>i.id===it.refId)||{})*it.qty : getRecipeAnalysis(it.refId).costPerYieldUnit*it.qty; });
      c = round2(c); const t = Math.max(Number(document.getElementById('sfc')?.value)||25,1), s = Number(document.getElementById('rsell')?.value)||0;
      document.getElementById('lc').textContent = fmtEuro(c); document.getElementById('ssug').textContent = fmtEuro(round2(c/(t/100)));
      document.getElementById('lf').textContent = (s>0?fmtNum(round2((c/s)*100),1):'0')+'%'; document.getElementById('lm').textContent = fmtEuro(round2(s-c));
    }
    function saveRecipe(e, id) {
      e.preventDefault(); const fd = new FormData(e.target);
      const o = { id: id||uid('rec'), code: fd.get('code').trim(), name: fd.get('name').trim(), category: fd.get('category'), isSemiFinished: fd.get('isSemiFinished')==='on', yieldQty: Number(fd.get('yieldQty'))||1, yieldUom: fd.get('yieldUom')||'pz', sellingPriceNet: Number(fd.get('sellingPriceNet'))||0, vatPct: Number(fd.get('vatPct'))||10, notes: fd.get('notes').trim(), items: tmpRecItems };
      if (id) { const idx = state.recipes.findIndex(x=>x.id===id); if (idx>=0) state.recipes[idx]=o; } else state.recipes.push(o);
      saveState(); closeModal(); renderApp(); showToast('Scheda tecnica salvata!', 'success');
    }

    function addEvEq(e, evId) {

        </div>
        <div class="tableau-canvas relative min-h-[360px] rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50 p-4 overflow-auto" ondragover="event.preventDefault()" ondrop="onTblDrop(event,'${ev.id}')">
          <div class="relative min-w-[650px] min-h-[330px]" id="tbl-stage">
            ${tbs.map((tb, i) => {
              const x = tb.x ?? ((i%3)*210+30), y = tb.y ?? (Math.floor(i/3)*130+20);
              const sc = tb.shape==='Tondo' ? 'rounded-full w-32 h-32' : (tb.shape==='Sposi' ? 'rounded-2xl w-44 h-20 bg-amber-50 border-amber-400' : 'rounded-xl w-48 h-24 bg-white');

                <div class="text-[10px] text-slate-500">${tb.assigned}/${tb.seats} pax</div>

              </div>`;
            }).join('')}

        </div>
        <div class="border rounded-xl overflow-x-auto"><table class="w-full text-left"><thead class="bg-slate-50 text-[11px] uppercase"><tr><th class="px-3 py-2">Tavolo</th><th class="px-3 py-2">Forma</th><th class="px-3 py-2 text-right">Posti</th><th class="px-3 py-2 text-right">Assegnati</th><th class="px-3 py-2">Note</th><th class="px-3 py-2"></th></tr></thead>
        <tbody class="divide-y">${tbs.map(tb=>`<tr><td class="px-3 py-2"><input value="${esc(tb.name)}" onchange="updTbl('${ev.id}','${tb.id}','name',this.value)" class="px-2 py-1 border rounded w-40" /></td><td class="px-3 py-2">${tb.shape}</td><td class="px-3 py-2 text-right"><input type="number" value="${tb.seats}" onchange="updTbl('${ev.id}','${tb.id}','seats',Number(this.value))" class="w-16 px-2 py-1 border rounded text-right" /></td><td class="px-3 py-2 text-right"><input type="number" value="${tb.assigned}" onchange="updTbl('${ev.id}','${tb.id}','assigned',Number(this.value))" class="w-16 px-2 py-1 border rounded text-right font-bold" /></td><td class="px-3 py-2"><input value="${esc(tb.notes||'')}" onchange="updTbl('${ev.id}','${tb.id}','notes',this.value)" class="w-full px-2 py-1 border rounded" /></td><td class="px-3 py-2 text-right"><button onclick="rmTbl('${ev.id}','${tb.id}')" class="text-rose-500">✕</button></td></tr>`).join('')}</tbody></table></div>

    function onTblDrag(e, evId, tbId) { const r = e.target.getBoundingClientRect(); draggedTableInfo = { evId, tbId, ox: e.clientX-r.left, oy: e.clientY-r.top }; }
    function onTblDrop(e, evId) {
      e.preventDefault(); if (!draggedTableInfo || draggedTableInfo.evId!==evId) return;
      const st = document.getElementById('tbl-stage').getBoundingClientRect();
      const tb = state.events.find(x=>x.id===evId)?.tables?.find(t=>t.id===draggedTableInfo.tbId);
      if (tb) { tb.x = Math.max(0, Math.round(e.clientX-st.left-draggedTableInfo.ox)); tb.y = Math.max(0, Math.round(e.clientY-st.top-draggedTableInfo.oy)); saveState(); renderApp(); }
      draggedTableInfo = null;
    }
    function addEvTable(e, evId) {
      e.preventDefault(); const fd = new FormData(e.target), ev = state.events.find(x=>x.id===evId), idx = ev.tables.length, seats = Number(fd.get('seats'))||10;
      ev.tables.push({id:uid('tb'),name:fd.get('name').trim(),shape:fd.get('shape'),seats,assigned:seats,notes:fd.get('notes').trim(),x:(idx%3)*210+30,y:Math.floor(idx/3)*130+20});
      saveState(); renderApp();
    }
    function updTbl(evId, tbId, f, v) { const tb = state.events.find(x=>x.id===evId)?.tables?.find(t=>t.id===tbId); if(tb){tb[f]=v; saveState(); renderApp();} }
    function rmTbl(evId, tbId) { const ev = state.events.find(x=>x.id===evId); ev.tables = ev.tables.filter(t=>t.id!==tbId); saveState(); renderApp(); }

          ${ui.inventorySubTab==='carico'?`<div class="bg-white rounded-2xl p-6 border max-w-xl text-xs space-y-4"><h3 class="font-bold text-sm">Carico Merci (Aggiorna Stock & Listino Ricette)</h3><form onsubmit="submitCarico(event)" class="space-y-3"><div class="grid grid-cols-2 gap-3"><input name="date" type="date" required value="${todayStr()}" class="px-3 py-2 border rounded-xl" /><input name="refDoc" required placeholder="N. DDT / Fattura" class="px-3 py-2 border rounded-xl" /></div><select id="c-ing" name="ingredientId" onchange="document.getElementById('c-pr').value=this.options[this.selectedIndex].dataset.p" class="w-full px-3 py-2 border rounded-xl">${state.ingredients.map(i=>`<option value="${i.id}" data-p="${i.priceNet}">${esc(i.name)} (${fmtNum(i.stock)} ${i.uomPurchase})</option>`).join('')}</select><div class="grid grid-cols-2 gap-3"><div><label class="block font-semibold mb-1">Qta Caricata</label><input name="qty" type="number" step="0.01" required value="5" class="w-full px-3 py-2 border rounded-xl font-bold" /></div><div><label class="block font-semibold mb-1">Nuovo Prezzo Netto (€)</label><input id="c-pr" name="unitPrice" type="number" step="0.01" required value="${state.ingredients[0]?.priceNet||0}" class="w-full px-3 py-2 border rounded-xl font-bold" /></div></div><input name="note" placeholder="Note" class="w-full px-3 py-2 border rounded-xl" /><button type="submit" class="px-5 py-2.5 bg-emerald-600 text-white rounded-xl font-semibold">Registra Carico</button></form></div>`:''}
          ${ui.inventorySubTab==='scarico'?renderScarico():''}

          ${ui.inventorySubTab==='history'?`<div class="bg-white rounded-2xl border overflow-x-auto text-xs"><table class="w-full text-left"><thead class="bg-slate-50 uppercase text-[11px]"><tr><th class="px-4 py-2.5">Data</th><th class="px-4 py-2.5">Tipo</th><th class="px-4 py-2.5">Rif.</th><th class="px-4 py-2.5">Dettaglio</th><th class="px-4 py-2.5 text-right">Valore</th></tr></thead><tbody class="divide-y">${state.movements.map(m=>`<tr><td class="px-4 py-2.5">${fmtDate(m.date)}</td><td class="px-4 py-2.5 font-bold">${m.type}</td><td class="px-4 py-2.5">${esc(m.refDoc)}</td><td class="px-4 py-2.5">${esc(state.ingredients.find(i=>i.id===m.ingredientId)?.name||'')} ${esc(m.note)}</td><td class="px-4 py-2.5 text-right font-bold">${fmtEuro(m.totalValue)}</td></tr>`).join('')}</tbody></table></div>`:''}
        </div>`;
    }
    function submitCarico(e) {
      e.preventDefault(); const fd = new FormData(e.target), ing = state.ingredients.find(i=>i.id===fd.get('ingredientId')); if(!ing) return;
      const q = Number(fd.get('qty'))||0, p = Number(fd.get('unitPrice'))||0;
      ing.stock = round2((Number(ing.stock)||0)+q); ing.priceNet = p;
      state.movements.unshift({id:uid('mv'),date:fd.get('date'),type:'CARICO',refDoc:fd.get('refDoc').trim(),ingredientId:ing.id,qty:q,unitPrice:p,totalValue:round2(q*p),note:fd.get('note').trim()});
      saveState(); renderApp(); showToast('Carico registrato e ricette ricalcolate!', 'success');
    }
    function renderScarico() {
      const nonSemi = state.recipes.filter(r=>!r.isSemiFinished), evs = state.events.filter(e=>e.status==='Confermato'||e.status==='Concluso');
      return `<div class="grid grid-cols-1 lg:grid-cols-3 gap-5 text-xs">
        <form onsubmit="subSale(event)" class="bg-white rounded-2xl p-5 border space-y-3"><h3 class="font-bold text-sm">Scarico Venduto Sala</h3><input name="date" type="date" required value="${todayStr()}" class="w-full px-3 py-2 border rounded-xl" /><select name="recipeId" class="w-full px-3 py-2 border rounded-xl">${nonSemi.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><input name="qty" type="number" min="1" value="10" required class="w-full px-3 py-2 border rounded-xl font-bold" /><button type="submit" class="w-full py-2.5 bg-slate-900 text-white rounded-xl font-semibold">Scarica da Venduto</button></form>
        <form onsubmit="subEvDeduct(event)" class="bg-white rounded-2xl p-5 border space-y-3"><h3 class="font-bold text-sm">Chiusura Evento Banqueting</h3><select name="eventId" class="w-full px-3 py-2 border rounded-xl">${evs.map(e=>`<option value="${e.id}">${esc(e.name)} (${fmtDate(e.date)})</option>`).join('')}</select><button type="submit" class="w-full py-2.5 bg-emerald-600 text-white rounded-xl font-semibold">Scarica Magazzino Evento</button></form>
        <form onsubmit="subWaste(event)" class="bg-white rounded-2xl p-5 border space-y-3"><h3 class="font-bold text-sm text-rose-700">Registro Scarti</h3><input name="date" type="date" required value="${todayStr()}" class="w-full px-3 py-2 border rounded-xl" /><select name="ingredientId" class="w-full px-3 py-2 border rounded-xl">${state.ingredients.map(i=>`<option value="${i.id}">${esc(i.name)} (${i.uomPurchase})</option>`).join('')}</select><input name="qty" type="number" step="0.01" value="0.5" required class="w-full px-3 py-2 border rounded-xl" /><input name="note" required placeholder="Motivo scarto" class="w-full px-3 py-2 border rounded-xl" /><button type="submit" class="w-full py-2.5 bg-rose-600 text-white rounded-xl font-semibold">Registra Scarto</button></form>
      </div>`;
    }
    function subSale(e) {
      e.preventDefault(); const fd = new FormData(e.target), rid = fd.get('recipeId'), qty = Number(fd.get('qty'))||0, d = fd.get('date');
      const need = explodeRecipe(rid, qty);
      Object.entries(need).forEach(([id,q])=>{ const i=state.ingredients.find(x=>x.id===id); if(i) i.stock=round2(Math.max(0,(Number(i.stock)||0)-q)); });
      state.restaurantSales.push({id:uid('rs'),date:d,recipeId:rid,qty});
      state.movements.unshift({id:uid('mv'),date:d,type:'SCARICO_VENDUTO',refDoc:'Sala',ingredientId:'',qty,unitPrice:0,totalValue:round2(qty*getRecipeAnalysis(rid).totalCost),note:`${qty}x ${state.recipes.find(r=>r.id===rid)?.name}`});
      saveState(); renderApp(); showToast('Venduto registrato e stock scaricato!', 'success');
    }
    function subEvDeduct(e) {
      e.preventDefault(); const ev = state.events.find(x=>x.id===new FormData(e.target).get('eventId')); const pkg = state.packages.find(p=>p.id===ev?.packageId); if(!pkg) return;
      const pax = ev.adults + ev.children*((Number(pkg.childCostPct)||50)/100), acc = {};
      pkg.recipeIds.forEach(rid=>explodeRecipe(rid, pax, acc));
      Object.entries(acc).forEach(([id,q])=>{ const i=state.ingredients.find(x=>x.id===id); if(i) i.stock=round2(Math.max(0,(Number(i.stock)||0)-q)); });
      state.movements.unshift({id:uid('mv'),date:todayStr(),type:'SCARICO_EVENTO',refDoc:ev.name,ingredientId:'',qty:pax,unitPrice:0,totalValue:getEventFinancials(ev).foodCost,note:`Scarico evento ${ev.name}`});
      saveState(); renderApp(); showToast(`Scarico completato per ${ev.name}!`, 'success');
    }
    function subWaste(e) {
      e.preventDefault(); const fd = new FormData(e.target), ing = state.ingredients.find(i=>i.id===fd.get('ingredientId')), q = Number(fd.get('qty'))||0; if(!ing) return;
      ing.stock = round2(Math.max(0,(Number(ing.stock)||0)-q));
      state.movements.unshift({id:uid('mv'),date:fd.get('date'),type:'SCARTO',refDoc:'Scarto',ingredientId:ing.id,qty:q,unitPrice:ing.priceNet,totalValue:round2(q*ing.priceNet),note:fd.get('note').trim()});
      saveState(); renderApp(); showToast('Scarto registrato.', 'warning');
    }

    function calc7DayNeeds() {
      const start = todayStr(), end = todayStr(7);
      const up = state.events.filter(e=>e.status==='Confermato' && e.date>=start && e.date<=end);
      const evNeeds = {};
      up.forEach(ev=>{ const pkg=state.packages.find(p=>p.id===ev.packageId); if(!pkg)return; const pax=ev.adults+ev.children*((Number(pkg.childCostPct)||50)/100); pkg.recipeIds.forEach(rid=>explodeRecipe(rid,pax,evNeeds)); });
      const bySup = {};
      state.ingredients.forEach(ing=>{
        const evQ = evNeeds[ing.id]||0, ord = round2(Math.max(0, (evQ + (Number(ing.minStock)||0)) - (Number(ing.stock)||0)));
        if (ord > 0) { const sid = ing.supplierId||'none'; if(!bySup[sid]) bySup[sid]=[]; bySup[sid].push({ing,evQ:round2(evQ),ord,cost:round2(ord*(Number(ing.priceNet)||0))}); }
      });
      return { up, bySup };
    }
    function renderNeeds7d() {
      const { up, bySup } = calc7DayNeeds();
      return `<div class="space-y-4 text-xs">
        <div class="bg-white rounded-2xl p-4 border flex flex-wrap justify-between items-center gap-3">
          <div><h3 class="font-bold text-sm">Fabbisogno Acquisti (Prossimi 7gg + Scorte Minime)</h3><p class="text-slate-500">Eventi confermati inclusi: <strong>${up.length}</strong> (${up.map(e=>e.name).join(', ')||'nessuno'})</p></div>
          <button onclick="exportNeedsCSV()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl font-semibold">Esporta Lista Spesa CSV</button>
        </div>
        ${Object.entries(bySup).map(([sid, items])=>{
          const sup = state.suppliers.find(s=>s.id===sid);
          return `<div class="bg-white rounded-2xl border overflow-hidden"><div class="px-4 py-3 bg-slate-900 text-white flex justify-between font-bold"><span>${esc(sup?.name||'Senza Fornitore')}</span><span class="text-emerald-400">Totale: ${fmtEuro(items.reduce((s,x)=>s+x.cost,0))}</span></div>
          <table class="w-full text-left"><thead class="bg-slate-50 text-[11px] uppercase"><tr><th class="px-4 py-2">Articolo</th><th class="px-4 py-2 text-right">Fabb. Eventi</th><th class="px-4 py-2 text-right">Stock</th><th class="px-4 py-2 text-right">Min</th><th class="px-4 py-2 text-right">Da Ordinare</th><th class="px-4 py-2 text-right">Stima €</th></tr></thead>
          <tbody class="divide-y">${items.map(it=>`<tr><td class="px-4 py-2 font-semibold">${esc(it.ing.name)}</td><td class="px-4 py-2 text-right">${fmtNum(it.evQ)} ${it.ing.uomPurchase}</td><td class="px-4 py-2 text-right">${fmtNum(it.ing.stock)}</td><td class="px-4 py-2 text-right">${fmtNum(it.ing.minStock)}</td><td class="px-4 py-2 text-right font-extrabold text-emerald-700">${fmtNum(it.ord)} ${it.ing.uomPurchase}</td><td class="px-4 py-2 text-right font-bold">${fmtEuro(it.cost)}</td></tr>`).join('')}</tbody></table></div>`;
        }).join('')||'<div class="bg-white rounded-2xl p-8 text-center text-emerald-700 font-semibold border">Nessun acquisto necessario!</div>'}
      </div>`;
    }
    function exportNeedsCSV() {
      const { bySup } = calc7DayNeeds(), rows = [];
      Object.entries(bySup).forEach(([sid, items])=>{ const sn=state.suppliers.find(s=>s.id===sid)?.name||'N/D'; items.forEach(it=>rows.push([sn,it.ing.code,it.ing.name,fmtNum(it.evQ),fmtNum(it.ing.stock),fmtNum(it.ord),it.ing.uomPurchase,fmtNum(it.cost)])); });
      downloadCSV(`fabbisogno_7gg_${todayStr()}.csv`, ['Fornitore','Codice','Articolo','Fabb Eventi','Stock','Da Ordinare','UdM','Stima €'], rows);
    }

      return `<div class="space-y-5">

            <button onclick="ui.staffSubTab='staff'; renderApp()" class="px-4 py-2 rounded-lg text-xs font-semibold ${ui.staffSubTab==='staff'?'bg-slate-900 text-white':'text-slate-600'}">Staff (${state.staff.length})</button>
            <button onclick="ui.staffSubTab='shifts'; renderApp()" class="px-4 py-2 rounded-lg text-xs font-semibold ${ui.staffSubTab==='shifts'?'bg-slate-900 text-white':'text-slate-600'}">Turni Settimanali</button>
            <button onclick="ui.staffSubTab='suppliers'; renderApp()" class="px-4 py-2 rounded-lg text-xs font-semibold ${ui.staffSubTab==='suppliers'?'bg-slate-900 text-white':'text-slate-600'}">Fornitori (${state.suppliers.length})</button>

        </div>
        ${ui.staffSubTab==='staff'?`<div class="bg-white rounded-2xl border overflow-x-auto text-xs"><table class="w-full text-left"><thead class="bg-slate-50 uppercase text-[11px]"><tr><th class="px-4 py-3">Nome</th><th class="px-4 py-3">Ruolo</th><th class="px-4 py-3">Contratto</th><th class="px-4 py-3">Tel</th><th class="px-4 py-3 text-right">Costo/h</th><th class="px-4 py-3"></th></tr></thead><tbody class="divide-y">${state.staff.map(s=>`<tr><td class="px-4 py-3 font-bold">${esc(s.name)}</td><td class="px-4 py-3">${esc(s.role)}</td><td class="px-4 py-3">${esc(s.contract)}</td><td class="px-4 py-3">${esc(s.phone)}</td><td class="px-4 py-3 text-right font-bold text-emerald-700">${fmtEuro(s.hourlyCost)}</td><td class="px-4 py-3 text-right"><button onclick="openStaffModal('${s.id}')" class="p-1"><i data-lucide="edit-3" class="w-4 h-4"></i></button><button onclick="delStaff('${s.id}')" class="p-1 text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join('')}</tbody></table></div>`:''}
        ${ui.staffSubTab==='shifts'?renderShiftsTab():''}
        ${ui.staffSubTab==='suppliers'?`<div class="bg-white rounded-2xl border overflow-x-auto text-xs"><table class="w-full text-left"><thead class="bg-slate-50 uppercase text-[11px]"><tr><th class="px-4 py-3">Fornitore</th><th class="px-4 py-3">Cat.</th><th class="px-4 py-3">Contatti</th><th class="px-4 py-3">Consegne</th><th class="px-4 py-3">Pagamento</th><th class="px-4 py-3"></th></tr></thead><tbody class="divide-y">${state.suppliers.map(s=>`<tr><td class="px-4 py-3 font-bold">${esc(s.name)}</td><td class="px-4 py-3">${esc(s.category)}</td><td class="px-4 py-3">${esc(s.phone)} · ${esc(s.email)}</td><td class="px-4 py-3">${esc(s.deliveryDays)}</td><td class="px-4 py-3">${esc(s.paymentTerms)}</td><td class="px-4 py-3 text-right"><button onclick="openSupplierModal('${s.id}')" class="p-1"><i data-lucide="edit-3" class="w-4 h-4"></i></button><button onclick="delSup('${s.id}')" class="p-1 text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join('')}</tbody></table></div>`:''}
      </div>`;
    }
    function openStaffModal(id=null) {
      const s = id?state.staff.find(x=>x.id===id):{id:'',name:'',role:'Cameriere',contract:'Indeterminato',hourlyCost:16,phone:''};
      openModal(`<div class="px-6 py-4 border-b flex justify-between bg-slate-50"><h3 class="font-bold">Staff</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div><form onsubmit="saveStf(event,'${id||''}')" class="p-6 space-y-3 text-xs"><div class="grid grid-cols-2 gap-3"><input name="name" required placeholder="Nome" value="${esc(s.name)}" class="px-3 py-2 border rounded-xl" /><input name="role" required placeholder="Ruolo" value="${esc(s.role)}" class="px-3 py-2 border rounded-xl" /></div><div class="grid grid-cols-3 gap-3"><select name="contract" class="px-3 py-2 border rounded-xl">${['Indeterminato','Determinato','Extra / Chiamata'].map(c=>`<option ${s.contract===c?'selected':''}>${c}</option>`).join('')}</select><input name="hourlyCost" type="number" step="0.5" required value="${s.hourlyCost}" class="px-3 py-2 border rounded-xl" /><input name="phone" placeholder="Tel" value="${esc(s.phone)}" class="px-3 py-2 border rounded-xl" /></div><div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl">Annulla</button><button type="submit" class="px-5 py-2 bg-emerald-600 text-white rounded-xl font-semibold">Salva</button></div></form>`);

    function saveStf(e,id){ e.preventDefault(); const fd=new FormData(e.target), o={id:id||uid('stf'),name:fd.get('name').trim(),role:fd.get('role').trim(),contract:fd.get('contract'),hourlyCost:Number(fd.get('hourlyCost'))||0,phone:fd.get('phone').trim()}; if(id){const i=state.staff.findIndex(x=>x.id===id); if(i>=0)state.staff[i]=o;}else state.staff.push(o); saveState(); closeModal(); renderApp(); }
    function delStaff(id){ if(confirm('Eliminare?')){state.staff=state.staff.filter(s=>s.id!==id); saveState(); renderApp();} }

    function renderShiftsTab() {
      const days = Array.from({length:7},(_,i)=>addDays(ui.shiftWeekStart,i)), dn = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
      let wTot = 0; const dTot = days.map(d=>{ const c=state.shifts.filter(sh=>sh.date===d).reduce((s,sh)=>{const p=state.staff.find(x=>x.id===sh.staffId); return s+(p?p.hourlyCost*sh.hours:0);},0); wTot+=c; return round2(c); });
      return `<div class="space-y-4 text-xs">
        <div class="bg-white rounded-2xl p-4 border flex flex-wrap justify-between items-center gap-3"><div class="flex items-center gap-2"><button onclick="ui.shiftWeekStart=addDays(ui.shiftWeekStart,-7); renderApp()" class="px-3 py-1 border rounded">&larr;</button><strong>${fmtDate(days[0])} - ${fmtDate(days[6])}</strong><button onclick="ui.shiftWeekStart=addDays(ui.shiftWeekStart,7); renderApp()" class="px-3 py-1 border rounded">&rarr;</button></div><strong class="text-emerald-700 text-sm">Costo Lavoro Settimana: ${fmtEuro(wTot)}</strong></div>

      </div>`;
    }
    function addShift(e){ e.preventDefault(); const fd=new FormData(e.target); state.shifts.push({id:uid('sh'),staffId:fd.get('staffId'),date:fd.get('date'),hours:Number(fd.get('hours'))||8,area:fd.get('area')}); saveState(); renderApp(); }

      openModal(`<div class="px-6 py-4 border-b flex justify-between bg-slate-50"><h3 class="font-bold">Fornitore</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div><form onsubmit="saveSup(event,'${id||''}')" class="p-6 space-y-3 text-xs"><div class="grid grid-cols-2 gap-3"><input name="name" required placeholder="Ragione Sociale" value="${esc(s.name)}" class="px-3 py-2 border rounded-xl" /><select name="category" class="px-3 py-2 border rounded-xl">${['Food','Beverage','Food/Dry','Noleggi/Lavanderia','Fioristi'].map(c=>`<option ${s.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="grid grid-cols-2 gap-3"><input name="phone" placeholder="Telefono" value="${esc(s.phone)}" class="px-3 py-2 border rounded-xl" /><input name="email" placeholder="Email" value="${esc(s.email)}" class="px-3 py-2 border rounded-xl" /></div><div class="grid grid-cols-2 gap-3"><input name="deliveryDays" placeholder="Giorni Consegna" value="${esc(s.deliveryDays)}" class="px-3 py-2 border rounded-xl" /><input name="paymentTerms" placeholder="Condizioni Pagamento" value="${esc(s.paymentTerms)}" class="px-3 py-2 border rounded-xl" /></div><div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl">Annulla</button><button type="submit" class="px-5 py-2 bg-emerald-600 text-white rounded-xl font-semibold">Salva</button></div></form>`);
    }
    function saveSup(e,id){ e.preventDefault(); const fd=new FormData(e.target), o={id:id||uid('sup'),name:fd.get('name').trim(),category:fd.get('category'),phone:fd.get('phone').trim(),email:fd.get('email').trim(),deliveryDays:fd.get('deliveryDays').trim(),paymentTerms:fd.get('paymentTerms').trim()}; if(id){const i=state.suppliers.findIndex(x=>x.id===id); if(i>=0)state.suppliers[i]=o;}else state.suppliers.push(o); saveState(); closeModal(); renderApp(); }
    function delSup(id){ if(confirm('Eliminare?')){state.suppliers=state.suppliers.filter(s=>s.id!==id); saveState(); renderApp();} }

    // =========================================================================
    // MODULO 8: MENU ENGINEERING (MATRICE KASAVANA & SMITH)
    // =========================================================================
    function getMenuEngineeringData() {
      const dishes = state.recipes.filter(r => !r.isSemiFinished && Number(r.sellingPriceNet) > 0);
      const qtyMap = {};
      state.restaurantSales.forEach(s => { qtyMap[s.recipeId] = (qtyMap[s.recipeId] || 0) + (Number(s.qty) || 0); });

      let totalQty = 0, totalCM = 0;
      const raw = dishes.map(d => {
        const ra = getRecipeAnalysis(d.id), qtySold = qtyMap[d.id] || 0;
        const margin = round2((Number(d.sellingPriceNet) || 0) - ra.totalCost);
        const totalMargin = round2(margin * qtySold);
        totalQty += qtySold; totalCM += totalMargin;
        return { id: d.id, name: d.name, category: d.category, qtySold, cost: ra.totalCost, price: Number(d.sellingPriceNet), fcPct: ra.foodCostPct, margin, totalMargin };
      });

      const n = Math.max(raw.length, 1);
      const popThreshold = round2((0.70 / n) * totalQty);
      const cmThreshold = totalQty > 0 ? round2(totalCM / totalQty) : 0;

      const items = raw.map(it => {
        const highPop = it.qtySold >= popThreshold, highCM = it.margin >= cmThreshold;
        let classification = 'DOG', tip = 'Valutare rimozione dal menu o completo restyling ricetta/prezzo.';
        if (highPop && highCM) { classification = 'STAR'; tip = 'Piatto punta di diamante: mantenere qualità costante e massima visibilità in carta.'; }
        else if (highPop && !highCM) { classification = 'PLOWHORSE'; tip = 'Molto venduto ma margine basso: ottimizzare grammatura, food cost o aumentare leggermente il prezzo.'; }
        else if (!highPop && highCM) { classification = 'PUZZLE'; tip = 'Alto margine ma poche vendite: spingere tramite upselling dei camerieri o box evidenziato.'; }
        return { ...it, classification, tip };
      });
      return { items, popThreshold, cmThreshold, totalQty, totalCM: round2(totalCM) };
    }

    function renderMenuEngineering() {
      const d = getMenuEngineeringData();
      const badge = { STAR: 'bg-emerald-100 text-emerald-800', PLOWHORSE: 'bg-amber-100 text-amber-800', PUZZLE: 'bg-blue-100 text-blue-800', DOG: 'bg-rose-100 text-rose-800' };
      return `
        <div class="space-y-5">
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 text-xs">
            <div class="bg-white p-4 rounded-2xl border"><div class="text-slate-500">Piatti Analizzati</div><div class="text-xl font-extrabold mt-1">${d.items.length}</div></div>
            <div class="bg-white p-4 rounded-2xl border"><div class="text-slate-500">Porzioni Vendute</div><div class="text-xl font-extrabold mt-1">${d.totalQty}</div></div>
            <div class="bg-white p-4 rounded-2xl border"><div class="text-slate-500">Soglia Popolarità (70%)</div><div class="text-xl font-extrabold text-amber-600 mt-1">${fmtNum(d.popThreshold, 1)} pz</div></div>
            <div class="bg-white p-4 rounded-2xl border"><div class="text-slate-500">Margine Medio Ponderato</div><div class="text-xl font-extrabold text-emerald-700 mt-1">${fmtEuro(d.cmThreshold)}</div></div>
          </div>
          <div class="bg-white rounded-2xl p-5 border"><h2 class="text-sm font-bold mb-1">Matrice Kasavana & Smith (Popolarità vs Margine)</h2><div class="h-72"><canvas id="chart-menu-eng"></canvas></div></div>
          <div class="bg-white rounded-2xl border overflow-x-auto text-xs">
            <table class="w-full text-left"><thead class="bg-slate-50 uppercase text-[11px] border-b"><tr><th class="px-4 py-3">Piatto / Drink</th><th class="px-4 py-3 text-right">Venduti</th><th class="px-4 py-3 text-right">Costo</th><th class="px-4 py-3 text-right">Prezzo</th><th class="px-4 py-3 text-right">Margine Unit.</th><th class="px-4 py-3 text-right">Margine Tot.</th><th class="px-4 py-3">Classe</th><th class="px-4 py-3">Suggerimento Operativo</th></tr></thead>
            <tbody class="divide-y">${d.items.map(it=>`<tr><td class="px-4 py-3 font-bold">${esc(it.name)}<div class="text-[10px] text-slate-400">${esc(it.category)}</div></td><td class="px-4 py-3 text-right font-bold">${it.qtySold}</td><td class="px-4 py-3 text-right">${fmtEuro(it.cost)}</td><td class="px-4 py-3 text-right">${fmtEuro(it.price)}</td><td class="px-4 py-3 text-right font-bold text-emerald-700">${fmtEuro(it.margin)}</td><td class="px-4 py-3 text-right font-bold">${fmtEuro(it.totalMargin)}</td><td class="px-4 py-3"><span class="px-2.5 py-0.5 rounded-full font-extrabold text-[11px] ${badge[it.classification]}">${it.classification}</span></td><td class="px-4 py-3 text-slate-600 max-w-xs">${it.tip}</td></tr>`).join('')}</tbody></table>
          </div>
        </div>`;
    }

    function initMenuEngChart() {
      const d = getMenuEngineeringData(), ctx = document.getElementById('chart-menu-eng'); if (!ctx) return;
      const colors = { STAR: '#10b981', PLOWHORSE: '#f59e0b', PUZZLE: '#3b82f6', DOG: '#ef4444' };
      chartInstances.me = new Chart(ctx, {
        type: 'scatter',
        data: { datasets: ['STAR','PLOWHORSE','PUZZLE','DOG'].map(cls => ({ label: cls, data: d.items.filter(i=>i.classification===cls).map(i=>({x:i.qtySold,y:i.margin,name:i.name})), backgroundColor: colors[cls], pointRadius: 7 })) },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { tooltip: { callbacks: { label: c => `${c.raw.name}: ${c.raw.x} pz, Margine ${fmtEuro(c.raw.y)}` } }, legend: { position: 'bottom' } },
          scales: { x: { title: { display: true, text: 'Quantità Venduta (Popolarità)' } }, y: { title: { display: true, text: 'Margine di Contribuzione (€)' } } }
        }
      });
    }
